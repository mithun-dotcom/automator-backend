<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; color: #16181d; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-weight: 600; margin: 8px 0 3px; font-size: 12px; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #d0d4da; border-radius: 6px; font: inherit; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  button { border: 0; border-radius: 6px; padding: 7px 12px; font: inherit; font-weight: 600; background: #1a73e8; color: #fff; cursor: pointer; }
  button.ghost { background: #eef2f7; color: #1a73e8; }
  .status { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: #f1f3f4; }
  .ok { background: #e6f4ea; color: #137333; }
  .bad { background: #fce8e6; color: #c5221f; }
  .log { margin-top: 10px; max-height: 180px; overflow: auto; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #5f6368; white-space: pre-wrap; }
  .hint { color: #5f6368; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>DKIM Automator</h1>
  <label>Dashboard URL</label>
  <input id="serverUrl" type="text" placeholder="https://dkim-automator.onrender.com">
  <label>Access key (dashboard password)</label>
  <input id="key" type="password">
  <div class="row">
    <label style="margin:0; display:flex; gap:6px; align-items:center; font-weight:500"><input id="enabled" type="checkbox"> Enabled</label>
    <span style="flex:1"></span>
    <button class="ghost" id="save">Save</button>
    <button id="poll">Check now</button>
  </div>
  <div class="status" id="status">…</div>
  <div class="hint">Keep Chrome open while jobs run. Sign in to admin.google.com in this Chrome with each Google Admin account you use. The extension works in a pinned background tab.</div>
  <div class="log" id="log"></div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
